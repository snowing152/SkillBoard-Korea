# Local infrastructure only (ADR 0011). Apps run on the host with `pnpm dev`.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: skillboard
      POSTGRES_PASSWORD: skillboard
      POSTGRES_DB: skillboard
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U skillboard -d skillboard']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage for profile photos (Cloudflare R2 in production, ADR 0013).
  # RustFS replaces MinIO, whose public Docker images were withdrawn. Console: http://localhost:9001
  storage:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - storage-data:/data

volumes:
  postgres-data:
  storage-data:
